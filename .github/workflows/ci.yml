name: CI/CD Pipeline

on:
  push:
    branches: [ "main", "master" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release Tag (e.g. v0.1.1)'
        required: false
        default: ''

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # =========================================================================
  # 1. WINDOWS BUILD & PACKAGING (Installer + Portable Zip)
  # =========================================================================
  build-windows:
    name: Windows x64 Build & Packaging
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Zig Compiler
        uses: mlugg/setup-zig@v2
        with:
          version: 0.17.0

      - name: Download FFmpeg Runtime DLLs
        run: |
          New-Item -ItemType Directory -Path vendor\ffmpeg\bin -Force
          curl.exe -L -o ffmpeg-shared.7z "https://www.gyan.dev/ffmpeg/builds/packages/ffmpeg-9.0.2-full_build-shared.7z"
          7z e ffmpeg-shared.7z -o"vendor\ffmpeg\bin" "*/bin/*.dll" -r -y
          Remove-Item ffmpeg-shared.7z -Force

      - name: Run Unit Tests
        run: |
          zig build test --summary all

      - name: Build LifeScreen (ReleaseFast)
        run: |
          zig build -Doptimize=ReleaseFast
          Copy-Item vendor\ffmpeg\bin\*.dll zig-out\bin\ -Force
          if (-not (Test-Path zig-out\bin\resources)) { New-Item -ItemType Directory -Path zig-out\bin\resources }
          Copy-Item resources\* zig-out\bin\resources\ -Force

      - name: Package Windows Artifacts (Installer & Portable Zip)
        run: |
          New-Item -ItemType Directory -Path dist -Force

          # 1. Sign application executable with Publisher Certificate
          powershell -ExecutionPolicy Bypass -File installer\sign_binaries.ps1 -FilePath zig-out\bin\lifescreen.exe

          # 2. Portable Zip
          Compress-Archive -Path zig-out\bin\* -DestinationPath dist\lifescreen-windows-x64-portable.zip -Force

          # 3. Build Inno Setup Installer
          if (-not (Test-Path "C:\Program Files (x86)\Inno Setup 6\ISCC.exe")) {
            choco install innosetup --no-progress -y
          }
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer\lifescreen_setup.iss

          # 4. Sign Installer with Publisher Certificate (Baneronetwo)
          powershell -ExecutionPolicy Bypass -File installer\sign_binaries.ps1 -FilePath dist\lifescreen-windows-x64-installer.exe

      - name: Upload Windows Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: lifescreen-windows
          path: |
            dist/lifescreen-windows-x64-installer.exe
            dist/lifescreen-windows-x64-portable.zip
          retention-days: 14

  # =========================================================================
  # 2. LINUX BUILD & PACKAGING (x64: .tar.gz, .deb, .rpm)
  # =========================================================================
  build-linux:
    name: Linux x64 Build & Packages
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Zig Compiler
        uses: mlugg/setup-zig@v2
        with:
          version: 0.17.0

      - name: Install Packaging Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y alien rpm

      - name: Check Zig Syntax & Formatter
        run: |
          zig fmt --check src/root.zig src/main.zig

      - name: Run Unit Tests
        run: |
          zig build test --summary all

      - name: Build LifeScreen Linux (ReleaseFast)
        run: |
          zig build -Doptimize=ReleaseFast

      - name: Package Linux Artifacts (tar.gz, deb, rpm)
        run: |
          mkdir -p dist

          # 1. Portable tar.gz
          tar -czvf dist/lifescreen-linux-x64.tar.gz -C zig-out/bin lifescreen

          # 2. Debian / Ubuntu .deb package
          mkdir -p deb-pkg/DEBIAN
          mkdir -p deb-pkg/usr/bin
          mkdir -p deb-pkg/usr/share/applications
          mkdir -p deb-pkg/usr/share/icons/hicolor/256x256/apps
          mkdir -p deb-pkg/usr/share/lifescreen/resources

          cp zig-out/bin/lifescreen deb-pkg/usr/bin/
          if [ -d "resources" ]; then cp -r resources/* deb-pkg/usr/share/lifescreen/resources/ 2>/dev/null || true; fi
          if [ -f "resources/icon.png" ]; then cp resources/icon.png deb-pkg/usr/share/icons/hicolor/256x256/apps/lifescreen.png 2>/dev/null || true; fi

          cat << 'EOF' > deb-pkg/DEBIAN/control
          Package: lifescreen
          Version: 0.1.0
          Section: video
          Priority: optional
          Architecture: amd64
          Maintainer: lifescreen-recorder <contact@lifescreen.app>
          Description: High performance screen, window, and game recorder.
          EOF

          cat << 'EOF' > deb-pkg/usr/share/applications/lifescreen.desktop
          [Desktop Entry]
          Name=LifeScreen
          Comment=High performance screen recorder
          Exec=lifescreen
          Icon=lifescreen
          Terminal=false
          Type=Application
          Categories=AudioVideo;Recorder;
          EOF

          chmod 755 deb-pkg/usr/bin/lifescreen
          dpkg-deb --build --root-owner-group deb-pkg dist/lifescreen-linux-x64.deb

          # 3. Fedora / RHEL / openSUSE .rpm package
          sudo alien -r --to-rpm --scripts dist/lifescreen-linux-x64.deb
          mv lifescreen*.rpm dist/lifescreen-linux-x64.rpm || true

      - name: Upload Linux Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: lifescreen-linux
          path: dist/lifescreen-linux-x64.*
          retention-days: 14

  # =========================================================================
  # 3. MACOS BUILD & PACKAGING (Apple Silicon: .tar.gz)
  # =========================================================================
  build-macos:
    name: macOS (Apple Silicon) Build & Test
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Zig Compiler
        uses: mlugg/setup-zig@v2
        with:
          version: 0.17.0

      - name: Run Unit Tests
        run: |
          zig build test --summary all

      - name: Build LifeScreen macOS (ReleaseFast)
        run: |
          zig build -Doptimize=ReleaseFast

      - name: Package macOS Release Artifact
        run: |
          mkdir -p dist
          tar -czvf dist/lifescreen-macos-arm64.tar.gz -C zig-out/bin lifescreen

      - name: Upload macOS Artifact
        uses: actions/upload-artifact@v4
        with:
          name: lifescreen-macos
          path: dist/lifescreen-macos-arm64.tar.gz
          retention-days: 14

  # =========================================================================
  # 4. GITHUB RELEASE AUTOMATION (Triggered on v* tag)
  # =========================================================================
  release:
    name: Publish Multi-Platform GitHub Release
    needs: [build-windows, build-linux, build-macos]
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository for version info
        uses: actions/checkout@v4

      - name: Determine Tag Name
        id: tag_info
        run: |
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            TAG="${{ github.ref_name }}"
          elif [ -n "${{ inputs.tag_name }}" ]; then
            TAG="${{ inputs.tag_name }}"
          else
            TAG="v$(cat VERSION 2>/dev/null || echo '0.1.1' | tr -d 'v \r\n')"
          fi
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "Target tag: $TAG"

      - name: Download All Artifacts
        uses: actions/download-artifact@v4
        with:
          path: ./temp-artifacts

      - name: Organize Release Artifacts & Generate Checksums
        run: |
          mkdir -p ./release-artifacts
          find ./temp-artifacts -type f \( -name "*.exe" -o -name "*.zip" -o -name "*.tar.gz" -o -name "*.deb" -o -name "*.rpm" \) -exec cp {} ./release-artifacts/ \;
          cd ./release-artifacts
          sha256sum * > sha256_checksums.txt
          ls -la

      - name: Create / Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag_info.outputs.tag }}
          name: ${{ steps.tag_info.outputs.tag }}
          files: |
            ./release-artifacts/*
          draft: false
          prerelease: ${{ contains(steps.tag_info.outputs.tag, 'alpha') || contains(steps.tag_info.outputs.tag, 'beta') || contains(steps.tag_info.outputs.tag, 'rc') }}
          generate_release_notes: true
