name: CI/CD Pipeline

on:
  push:
    branches: [ "main", "master" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # =========================================================================
  # 1. WINDOWS BUILD & TEST (Primary native platform)
  # =========================================================================
  build-windows:
    name: Windows x64 Build & Test
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Zig Compiler
        uses: mlugg/setup-zig@v2
        with:
          version: 0.17.0

      - name: Run Unit Tests
        run: |
          zig build test --summary all

      - name: Download FFmpeg Runtime DLLs
        run: |
          New-Item -ItemType Directory -Path vendor\ffmpeg\bin -Force
          curl.exe -L -o ffmpeg-shared.7z "https://www.gyan.dev/ffmpeg/builds/packages/ffmpeg-9.0.2-full_build-shared.7z"
          7z e ffmpeg-shared.7z -o"vendor\ffmpeg\bin" "*/bin/*.dll" -r -y
          Remove-Item ffmpeg-shared.7z -Force

      - name: Build LifeScreen (ReleaseFast)
        run: |
          zig build -Doptimize=ReleaseFast
          Copy-Item vendor\ffmpeg\bin\*.dll zig-out\bin\ -Force
          if (-not (Test-Path zig-out\bin\resources)) { New-Item -ItemType Directory -Path zig-out\bin\resources }
          Copy-Item resources\* zig-out\bin\resources\ -Force

      - name: Package Windows Release Artifact
        run: |
          New-Item -ItemType Directory -Path dist -Force
          Compress-Archive -Path zig-out\bin\* -DestinationPath dist\lifescreen-windows-x64.zip -Force

      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: lifescreen-windows-x64
          path: dist/lifescreen-windows-x64.zip
          retention-days: 14

  # =========================================================================
  # 2. LINUX CI & CROSS-COMPILATION CHECK
  # =========================================================================
  build-linux:
    name: Linux CI & Verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Zig Compiler
        uses: mlugg/setup-zig@v2
        with:
          version: 0.17.0

      - name: Check Zig Syntax & Formatter
        run: |
          zig fmt --check src/root.zig src/main.zig

      - name: Test Core Platform-Agnostic Subsystems
        run: |
          # Test core clock, ring_buffer, i18n, and config models
          zig test src/core/ring_buffer.zig
          zig test src/config/storage.zig

  # =========================================================================
  # 3. MACOS CI & ENVIRONMENT VERIFICATION
  # =========================================================================
  build-macos:
    name: macOS (Apple Silicon) Verification
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Zig Compiler
        uses: mlugg/setup-zig@v2
        with:
          version: 0.17.0

      - name: Verify Zig Toolchain on macOS
        run: |
          zig version
          zig fmt --check src/root.zig src/main.zig

      - name: Test Core Engine Modules
        run: |
          zig test src/core/ring_buffer.zig
          zig test src/config/storage.zig

  # =========================================================================
  # 4. GITHUB RELEASE AUTOMATION (Triggered on v*.*.* tag)
  # =========================================================================
  release:
    name: Publish GitHub Release
    needs: [build-windows, build-linux, build-macos]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download Windows Artifact
        uses: actions/download-artifact@v4
        with:
          name: lifescreen-windows-x64
          path: ./release-artifacts

      - name: Generate Checksums
        run: |
          cd ./release-artifacts
          sha256sum lifescreen-windows-x64.zip > sha256_checksums.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ./release-artifacts/lifescreen-windows-x64.zip
            ./release-artifacts/sha256_checksums.txt
          draft: false
          prerelease: false
          generate_release_notes: true
